# ============================================================
# 灵枢医疗多智能体系统 - Docker Compose 基础设施配置
# 启动命令: docker compose up -d
# 停止命令: docker compose down
# ============================================================
version: "3.8"

services:
  # ==================== MySQL 8.0 关系数据库 ====================
  mysql:
    image: mysql:8.0
    container_name: lingshu-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: medical_db
      MYSQL_USER: medical
      MYSQL_PASSWORD: medical123
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "15308:3306" # MySQL 容器映射到宿主机 15308
    volumes:
      - ./docker/mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - lingshu-net
    restart: unless-stopped

  # ==================== Redis Stack 缓存/消息队列 ====================
  redis:
    image: redis/redis-stack:7.4.0-v3
    container_name: lingshu-redis
    ports:
      - "6379:6379"     # Redis 服务端口
      - "8001:8001"     # RedisInsight 管理界面
    volumes:
      - ./docker/redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lingshu-net
    restart: unless-stopped

  # ==================== Etcd 分布式键值存储 (Milvus 依赖) ====================
  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    container_name: lingshu-milvus-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - ./docker/etcd_data:/etcd
    networks:
      - lingshu-net
    restart: unless-stopped

  # ==================== MinIO 对象存储 (Milvus 依赖) ====================
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: lingshu-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9000:9000"     # MinIO API 端口
      - "9001:9001"     # MinIO Console 管理界面
    volumes:
      - ./docker/minio_data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - lingshu-net
    restart: unless-stopped

  # ==================== Milvus 向量数据库 ====================
  milvus:
    image: milvusdb/milvus:v2.6.13
    container_name: lingshu-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "19530:19530"   # Milvus gRPC 端口
      - "9091:9091"     # Milvus 监控端口
    volumes:
      - ./docker/milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_started
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s
    networks:
      - lingshu-net
    restart: unless-stopped

  # ==================== Attu Milvus 管理界面 ====================
  attu:
    image: zilliz/attu:latest
    container_name: lingshu-attu
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "13000:3000"
    depends_on:
      milvus:
        condition: service_healthy
    networks:
      - lingshu-net
    restart: unless-stopped

  # ==================== Neo4j 图数据库 ====================
  neo4j:
    image: neo4j:5.20
    container_name: lingshu-neo4j
    environment:
      NEO4J_AUTH: neo4j/medical123
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"     # Neo4j HTTP 端口
      - "7687:7687"     # Neo4j Bolt 端口
    volumes:
      - ./docker/neo4j_data:/data
      - ./docker/neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - lingshu-net
    restart: unless-stopped

# ==================== 网络配置 ====================
networks:
  lingshu-net:
    driver: bridge
    name: lingshu-net

# ==================== 持久化命名卷 ====================
volumes:
  mysql_data:
    name: lingshu_mysql_data
  redis_data:
    name: lingshu_redis_data
  etcd_data:
    name: lingshu_etcd_data
  minio_data:
    name: lingshu_minio_data
  milvus_data:
    name: lingshu_milvus_data
  neo4j_data:
    name: lingshu_neo4j_data
  neo4j_logs:
    name: lingshu_neo4j_logs
