[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-agent"
version = "1.0.0"
description = "灵枢医疗多智能体系统 - 基于8层架构的医疗AI助手"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "fastapi==0.139.2",
    "uvicorn==0.34.0",
    "starlette==1.3.1",
    "python-multipart==0.0.32",
    "pydantic==2.10.4",
    "pydantic-settings==2.12.0",
    "python-dotenv==1.0.1",
    "sqlalchemy==2.0.30",
    "aiomysql>=0.2.0",
    "pymysql==1.1.2",
    "greenlet==3.0.1",
    "alembic==1.18.4",
    "redis>=7.3",
    "minio>=7.2",
    "pymilvus>=2.6",
    "neo4j==6.2.0",
    "pyjwt==2.8.0",
    "bcrypt==5.0.0",
    "cryptography==42.0.5",
    "authlib>=1.6",
    "loguru==0.7.3",
    "sentry-sdk==2.45.0",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "langchain==1.3.11",
    "langchain-core==1.4.8",
    "langchain-community==0.4.2",
    "langchain-openai==1.3.3",
    "langchain-deepseek>=1.0",
    "langgraph==1.2.7",
    "langgraph-checkpoint==4.1.1",
    "langgraph-checkpoint-redis>=0.4",
    "dashscope==1.26.2",
    "gradio==6.20.0",
    "httpx==0.28.1",
    "aiohttp==3.14.1",
    "pyyaml==6.0.3",
    "pandas==2.2.2",
    "tqdm==4.66.4",
    "graphrag>=1.0",
    "mineru>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov>=5.0",
]

[project.scripts]
medical-agent = "medical_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
